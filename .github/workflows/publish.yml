# Pushing a tag named v followed by the version builds, tests and packs the package, then publishes it to
# nuget.org. A manual run builds, tests and packs, keeps the package as an artifact, and publishes nowhere.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        shell: bash
        run: |
          dotnet build -c Release --nologo
          dotnet test -c Release --no-build --nologo

      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(dotnet msbuild src/QuarterCall -getProperty:Version | tr -d '\r')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "The tag is ${GITHUB_REF_NAME}, but the project's version is ${version}: the tag must be v${version}." >&2
            exit 1
          fi

      - name: Pack
        shell: bash
        run: dotnet pack -c Release --no-build --nologo -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error

  nuget:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
